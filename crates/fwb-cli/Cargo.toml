[package]
name = "fwb-cli"
description = "Method Budget command line: check, show and tidy .mthd budgets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "method"
path = "src/main.rs"

# Deprecated alias from before the rename to Method Budget (docs/CLI.md).
[[bin]]
name = "fwb"
path = "src/bin/fwb.rs"

[dependencies]
fwb-core = { path = "../fwb-core" }
fwb-format = { path = "../fwb-format" }
