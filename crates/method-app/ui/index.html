<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Method Budget</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="setup.css">
    <link rel="stylesheet" href="print.css">
    <link rel="stylesheet" href="reportsetup.css">
    <link rel="stylesheet" href="topsheet-setup.css">
    <link rel="stylesheet" href="apply.css">
    <link rel="stylesheet" href="quickentry.css">
    <link rel="stylesheet" href="context.css">
    <link rel="stylesheet" href="tools.css">
    <link rel="stylesheet" href="compare.css">
    <link rel="stylesheet" href="diffmerge.css">
    <link rel="stylesheet" href="presets.css">
    <link rel="stylesheet" href="importsetup.css">
    <link rel="stylesheet" href="library.css">
    <link rel="stylesheet" href="packs.css">
    <link rel="stylesheet" href="sheetimport.css">
    <link rel="stylesheet" href="actuals.css">
    <link rel="stylesheet" href="display.css">
    <link rel="stylesheet" href="sharing.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="explain.css">
    <link rel="stylesheet" href="setupwin.css">
    <link rel="stylesheet" href="updates.css">
    <link rel="stylesheet" href="licenses.css">
    <link rel="stylesheet" href="start.css">
    <script type="module" src="js/boot.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar-group" role="group" aria-label="File">
          <button type="button" class="btn" id="btn-new">New</button>
          <button type="button" class="btn" id="btn-open">Open</button>
          <button type="button" class="btn" id="btn-save">Save</button>
          <button type="button" class="btn" id="btn-saveas">Save As</button>
          <label class="autosave-switch"><input type="checkbox" id="autosave-switch" checked> Autosave</label>
        </div>
        <div class="toolbar-group" role="group" aria-label="History">
          <button type="button" class="btn" id="btn-undo" disabled>Undo</button>
          <button type="button" class="btn" id="btn-redo" disabled>Redo</button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Versions and comparing">
          <button type="button" class="btn" id="btn-versions">Versions</button>
          <button type="button" class="btn" id="btn-compare">Compare</button>
        </div>
        <div class="toolbar-group" role="group" aria-label="Budget setup">
          <button type="button" class="btn" id="btn-setup">Setup</button>
        </div>
        <div class="doc">
          <span class="doc-name" id="doc-name"></span>
          <span class="doc-dirty" id="doc-dirty" title="Unsaved changes" hidden></span>
        </div>
        <div class="update-status" id="update-status" role="status" aria-live="polite" hidden>
          <span class="update-text" id="update-text" hidden></span>
          <button type="button" class="btn update-restart" id="btn-update" hidden></button>
        </div>
        <div class="share-area" id="share-area" hidden>
          <div class="share-people" id="share-people" role="group" aria-label="People in this budget"></div>
          <button type="button" class="share-status" id="share-status" aria-haspopup="dialog" data-tone="quiet"><span class="share-dot" aria-hidden="true"></span><span class="share-status-text" id="share-status-text"></span></button>
        </div>
        <button type="button" class="btn" id="btn-share">Share</button>
        <button type="button" class="btn" id="btn-panel" aria-pressed="true" aria-controls="panel">Tools</button>
      </header>

      <div class="tabbar" id="tabbar"></div>

      <div class="workspace" id="workspace">
        <main class="main">
          <nav class="crumbs" id="crumbs" aria-label="Budget level"></nav>
          <div class="banner" id="banner" role="status" hidden></div>
          <div class="convert-banner" id="convert-banner" role="status" hidden></div>
          <div class="share-banner" id="share-banner" role="status" hidden></div>
          <div class="share-banner" id="review-banner" role="status" hidden></div>
          <div class="actions" id="actions"></div>
          <div class="formula-bar empty" id="formula-bar" role="group" aria-label="Selected cell as typed">
            <span class="formula-label" id="formula-label"></span>
            <span class="formula-text" id="formula-text"></span>
          </div>
          <div class="grid-host" id="grid-host" aria-label="Budget grid"></div>
        </main>
        <aside class="panel" id="panel" aria-label="Tools"></aside>
      </div>

      <footer class="footer" id="footer"></footer>
    </div>
    <div id="modal-root"></div>
    <div class="toast" id="toast" role="alert" hidden></div>
  </body>
</html>
