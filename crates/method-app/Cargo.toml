[package]
name = "method-app"
description = "Method Budget desktop app (Tauri): edit .mthd budgets in a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "method_app"
path = "src/lib.rs"

# The executable inside the bundles (Method Budget.app/Contents/MacOS/,
# the Windows and Linux installs). Every app in the suite names its desktop
# binary `method-<noun>-app` and its command line `method-<noun>`.
[[bin]]
name = "method-budget-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# build.rs reads the updater's endpoint and key from tauri.conf.json (already
# in the build through Tauri; nothing new).
serde_json = "=1.0.151"

[dependencies]
method-core = { path = "../method-core" }
method-format = { path = "../method-format" }
# Everything about an open budget that needs no window (sessions, edits,
# views, the command contract); also built for the web.
method-session = { path = "../method-session", features = ["std-clock"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.7.3"
# The suite's shared updater (method-production-suite/method-libs), pinned to a
# full commit: the check, the download and its minisign signature, the Mac
# bundle swap and restart, and the update policy (src/updater.rs).
method-update = { git = "https://github.com/method-production-suite/method-libs", rev = "25c80f8cfcc2e5222de4c5b79413a9de488196af" }
# Release plumbing shared with the release tooling: versions, release notes
# (What's New), the updater key's shape. No dependencies of its own.
method-release = { path = "../method-release" }
