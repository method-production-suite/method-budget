[package]
name = "method-app"
description = "Method Budget desktop app (Tauri): edit .mthd budgets in a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "method_app"
path = "src/lib.rs"

# The executable inside the bundles (Method Budget.app/Contents/MacOS/,
# the Windows and Linux installs).
[[bin]]
name = "method-budget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
method-core = { path = "../method-core" }
method-format = { path = "../method-format" }
# Everything about an open budget that needs no window (sessions, edits,
# views, the command contract); also built for the web.
method-session = { path = "../method-session" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.7.3"
# In-app updates (src/updater.rs): fetch latest.json, verify its minisign
# signature against the public key in tauri.conf.json, download, install.
# Driven from Rust only; no window is granted the plugin's own commands.
# No default features: rustls for TLS, and none of the v1-format archive
# readers (zip, and tar on Linux) or system proxy lookup. 2.12.0 is the
# newest release at least 14 days old (scripts/check-crate-ages.py).
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls"] }
# Release plumbing shared with the release tooling: versions, release notes
# (What's New), the updater key's shape. No dependencies of its own.
method-release = { path = "../method-release" }
# Already in the build through the updater plugin (same version, nothing
# new): its redirect policy keeps the updater's requests on https and on
# the update endpoint's hosts (src/updater.rs).
reqwest = { version = "=0.13.5", default-features = false }
