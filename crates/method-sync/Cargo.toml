[package]
name = "method-sync"
description = "Method Budget's live link between members of a shared budget: an encrypted connection, and nothing else on the network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# All the app's networking for live sessions lives here, never in method-core
# (decisions.md, entry 98). iroh's default features are off on purpose:
# `portmapper` would ask the router to open a port, and `metrics` isn't needed.

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time"] }
