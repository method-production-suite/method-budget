[package]
name = "method-session"
description = "Method Budget's open budgets without a window: sessions, undo, edits, views and the command contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Builds for wasm32-unknown-unknown as well as the desktop: no file system,
# no threads and no clock of its own (src/clock.rs). `cargo xtask
# wasm-check` and CI check it (docs/research/web-session.md).

[dependencies]
method-core = { path = "../method-core" }
method-format = { path = "../method-format", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
default = ["bundled-charts"]
# The chart-of-accounts templates compiled in (method-format's feature of
# the same name): the desktop. The browser build turns it off and hands in
# a chart when it is picked (src/coa_import.rs, `HostCharts`).
bundled-charts = ["method-format/bundled-charts"]
# The system clock as the default (src/clock.rs): for the desktop, never
# for a browser build, where std's clock panics.
std-clock = []
