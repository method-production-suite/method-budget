[package]
name = "method-web"
description = "Method Budget in a browser: method-session as WebAssembly, with a JS API and the page's invoke shim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built for wasm32-unknown-unknown only (`cargo xtask web`,
# docs/research/web-session.md). On the desktop the crate holds only a
# name helper and pulls in nothing new, so `cargo build` and `cargo test
# --workspace` stay as they were.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
method-format = { path = "../method-format" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
method-session = { path = "../method-session" }
serde_json = "=1.0.151"
# Both already in Cargo.lock through Tauri: no newer version is taken.
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
