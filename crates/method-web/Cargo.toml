[package]
name = "method-web"
description = "Method Budget in a browser: method-session as WebAssembly, with a JS API and the page's invoke shim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built for wasm32-unknown-unknown only (`cargo xtask web`,
# docs/research/web-session.md). On the desktop the crate holds only a
# name helper and pulls in nothing new, so `cargo build` and `cargo test
# --workspace` stay as they were.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without the bundled charts: the page fetches a chart's file when it is
# picked (`cargo xtask web` puts them in charts/ beside the page).
method-format = { path = "../method-format", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
method-session = { path = "../method-session", default-features = false }
serde_json = "=1.0.151"
# Both already in Cargo.lock through Tauri: no newer version is taken.
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
