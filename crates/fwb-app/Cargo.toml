[package]
name = "fwb-app"
description = "Film Wizard Budgeting desktop app (Tauri): edit .fwb budgets in a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fwb_app"
path = "src/lib.rs"

[[bin]]
name = "fwb-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
fwb-core = { path = "../fwb-core" }
fwb-format = { path = "../fwb-format" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", default-features = false, features = ["wry", "common-controls-v6", "x11", "dbus"] }
tauri-plugin-dialog = "=2.7.3"
