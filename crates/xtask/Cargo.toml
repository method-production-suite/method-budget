[package]
name = "xtask"
description = "Method Budget release tooling: versions, release notes, the update manifest (docs/RELEASING.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
method-release = { path = "../method-release" }
# The bundled charts, written beside the browser build's page (`web`).
method-format = { path = "../method-format" }
serde_json = "=1.0.151"
# Signs the updater archive with the version in its trusted comment
# (`sign-update`), the way the Tauri CLI signs it otherwise: the same key
# format and the same crate the CLI uses. The app requires that version
# (method-update; docs/RELEASING.md, "The updater key").
minisign = "=0.10.0"
# The app's updater, so `verify-update` (and the tests) check signatures exactly
# the way the app does (the same pinned commit as crates/method-app).
method-update = { git = "https://github.com/method-production-suite/method-libs", rev = "25c80f8cfcc2e5222de4c5b79413a9de488196af" }
