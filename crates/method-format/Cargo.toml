[package]
name = "method-format"
description = "Method Budget native file format: versioned, diff-friendly JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
method-core = { path = "../method-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Signed changes in a shared budget (decisions.md, entry 89): every change in
# the change log is signed by its author's Ed25519 key and checked against the
# key they published. Pure Rust, BSD-3-Clause; the precomputed tables ("fast")
# and zeroize, nothing else (no rand, no serde, no pkcs8).
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }

# A new key pair's 32 random bytes come from the system (key files are made on
# a desktop, never in a browser). Already in Cargo.lock through Tauri.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.4"

[features]
default = ["bundled-charts"]
# The chart-of-accounts templates (templates/charts/*.mthd, src/charts.rs)
# compiled in: on for the desktop and the command line. The browser build
# turns it off and fetches a chart's file only when it is picked
# (docs/research/web-session.md, "The charts in a browser").
bundled-charts = []
# Hidden entry points for the fuzz targets (fuzz/, not in this workspace):
# the version-delta patcher, which is otherwise private.
fuzzing = []
