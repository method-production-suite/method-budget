[package]
name = "method-format"
description = "Method Budget native file format: versioned, diff-friendly JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
method-core = { path = "../method-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[features]
default = ["bundled-charts"]
# The chart-of-accounts templates (templates/charts/*.mthd, src/charts.rs)
# compiled in: on for the desktop and the command line. The browser build
# turns it off and fetches a chart's file only when it is picked
# (docs/research/web-session.md, "The charts in a browser").
bundled-charts = []
# Hidden entry points for the fuzz targets (fuzz/, not in this workspace):
# the version-delta patcher, which is otherwise private.
fuzzing = []
