<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for site/og.png, the 1200x630 share card. Not linked from the site; it exists
     to be rendered: scripts/make-og.sh. Light brand tokens, system fonts, invented
     figures (the same as the home page's illustration). -->
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'">
<title>Method Budget share card</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/og-card.css">
</head>
<body>
  <div class="card">
    <img class="wm" src="assets/brand/wordmark.svg" alt="Method Budget">
    <p class="tag">Free and open source</p>
    <div class="copy">
      <h1>Film and TV budgeting that shows its working.</h1>
      <p>Open files on your own computer. Every number explained.</p>
    </div>
    <div class="sheet">
      <p class="head"><span>Explain</span><span>2300 Camera</span></p>
      <div><span>6 detail lines</span><b>198,550.00</b></div>
      <div class="sub"><span>Payroll taxes 18%</span><b>23,229.00</b></div>
      <div class="sub"><span>Health and pension 4.5%</span><b>5,807.25</b></div>
      <div class="net"><span>Account total</span><b>227,586.25</b></div>
    </div>
    <p class="url">methodbudget.com</p>
  </div>
</body></html>
