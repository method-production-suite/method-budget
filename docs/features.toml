# Method Budget's feature list: the single source for the feature section of README.md
# and the feature list on the website (site/index.html).
#
# After editing, regenerate both:
#
#     python3 scripts/site.py
#
# CI runs `python3 scripts/site.py --check`, which fails when README.md or the site no
# longer match this file. How it all fits together: docs/WEBSITE.md.
#
# Fields
#   [[group]]    id, title. Groups appear in the order written here.
#   [[feature]]  group    the id of a group above
#                title    a few words, no trailing period
#                text     one sentence, user-facing, ends with a period
#                status   "have" (built) or "soon" (planned)
#                ref      optional: roadmap items ("1.12") and decisions ("D44"), as a
#                         string or a list. A "have" feature whose roadmap item is not
#                         [have] in docs/ROADMAP.md is an error: the list never claims
#                         something that isn't built.
#
# [project] repo is the source repository's URL. It is written into the site's links
# (every <a href=... data-repo="path">) and the README's clone command, so moving the
# repository is a one-line edit here plus a regenerate.
#
# Write for someone who budgets films, not for someone who reads the code. No em dashes,
# no vendor names (the clean-room statement and the FAQ are the only places those go).
# Inline `code` is allowed; nothing else is markup.

[project]
repo = "https://github.com/method-production-suite/method-budget"

[[group]]
id = "engine"
title = "Budgeting engine"

[[group]]
id = "fringes"
title = "Fringes, globals, charges and credits"

[[group]]
id = "editor"
title = "Editing, split view and history"

[[group]]
id = "versions"
title = "Versions, compare, diff and merge"

[[group]]
id = "actuals"
title = "Actuals and cost reports"

[[group]]
id = "reports"
title = "Reports, PDF and spreadsheets"

[[group]]
id = "setup"
title = "Setup library and templates"

[[group]]
id = "cli"
title = "Command line and git"

# ---------------------------------------------------------------- engine

[[feature]]
group = "engine"
title = "Topsheet, accounts and detail lines"
text = "The familiar three levels, with every total rolling up live as you type."
status = "have"

[[feature]]
group = "engine"
title = "Money to the cent"
text = "Every amount is kept in whole cents and rounds the way production budgets have always rounded, with an exact mode if you want one."
status = "have"
ref = ["D1", "D2"]

[[feature]]
group = "engine"
title = "Formulas and globals"
text = "Amount, quantity and rate cells take formulas and named globals; change a global and every line that uses it follows."
status = "have"
ref = ["D5", "2.10"]

[[feature]]
group = "engine"
title = "Schedule-linked quantities"
text = "Read a schedule's day counts (shoot days, days per location, set, week or cast member) and set your globals from them, after a review of every change."
status = "have"
ref = ["3.8", "D76"]

[[feature]]
group = "engine"
title = "Currencies"
text = "Any line can be in its own currency, converted to the budget's base currency at rates you set."
status = "have"
ref = "D10"

[[feature]]
group = "engine"
title = "Groups and what-ifs"
text = "Tag lines into groups, leave a group out of the total to see a what-if, and get back to the exact cent when you put it back."
status = "have"
ref = "D4"

[[feature]]
group = "engine"
title = "Explain this number"
text = "Trace any total down to the lines, fringes, cutoffs, ranges and rounding steps that make it up."
status = "have"
ref = ["3.5", "D43"]

[[feature]]
group = "engine"
title = "Overtime helper"
text = "Work out a day or a week of straight time, overtime bands and sixth and seventh days, then write the pay into the line."
status = "have"
ref = ["3.10", "D43"]

[[feature]]
group = "engine"
title = "Fast on big budgets"
text = "An edit recalculates in about 5 ms on a 5,000-line budget."
status = "have"
ref = "D18"

# ---------------------------------------------------------------- fringes

[[feature]]
group = "fringes"
title = "Fringes with cutoffs and ranges"
text = "Percent and flat fringes, cutoffs per earner, fringe ranges across several lines, unit-hour flats and four ways to post them."
status = "have"
ref = "D3"

[[feature]]
group = "fringes"
title = "Globals with details"
text = "Give a global a description, a unit and decimals, show it by name in cells, and see the formulas behind a selection."
status = "have"
ref = ["2.10", "D34"]

[[feature]]
group = "fringes"
title = "Contractual charges"
text = "Percent and flat charges with exclusions, a live preview while you type, and the percent shown on the topsheet if you want it."
status = "have"
ref = ["2.16", "D38"]

[[feature]]
group = "fringes"
title = "Credits"
text = "Credit rows show gross, excluded fringes, net and how far you are from a cap."
status = "have"
ref = ["2.16", "D38"]

[[feature]]
group = "fringes"
title = "Incentive estimates by location"
text = "Limit a credit to the locations where the money is spent and see every program's estimate side by side, applied or not, from rates and caps you enter yourself."
status = "have"
ref = "D80"

[[feature]]
group = "fringes"
title = "Apply panel"
text = "Select lines, then tick fringes, groups, sets and locations on or off, with live totals for the selection."
status = "have"
ref = ["2.13", "D38"]

[[feature]]
group = "fringes"
title = "In-use counts"
text = "Every setup list shows how many lines use each item and what they cost, warns before you delete one in use, and finds them in a click."
status = "have"
ref = ["2.9", "D35"]

# ---------------------------------------------------------------- editor

[[feature]]
group = "editor"
title = "Keyboard-first grid"
text = "Drill in, climb out, step between accounts, fill down and move rows without touching the mouse; a shortcut sheet lists every key."
status = "have"
ref = ["1.7", "1.10", "D15"]

[[feature]]
group = "editor"
title = "Type-ahead and add on the fly"
text = "Units, currencies, sets, locations and globals complete as you type, and a new one can be added right from the cell."
status = "have"
ref = ["1.2", "1.3"]

[[feature]]
group = "editor"
title = "Never lose work"
text = "Autosave into the file, recovery copies for untitled budgets, rolling backups and a restore after a crash."
status = "have"
ref = ["1.1", "D20"]

[[feature]]
group = "editor"
title = "Budget tabs and split view"
text = "Open several budgets as tabs, each with its own undo, and put two side by side in one window."
status = "have"
ref = ["1.9", "2.26", "D25", "D40"]

[[feature]]
group = "editor"
title = "History list"
text = "Every undo step is listed by name and time; click one to go back to it, or save it as a version."
status = "have"
ref = ["2.23", "D40"]

[[feature]]
group = "editor"
title = "Find and replace"
text = "Search descriptions, account numbers, fringes, globals, groups, notes and formulas, then replace only in the results you tick, as one undo step."
status = "have"
ref = ["1.11", "D26"]

[[feature]]
group = "editor"
title = "Copy rows with everything on them"
text = "Rows keep their fringes, groups, notes, style and ranges when copied, even between budgets, with a review of what the paste will change."
status = "have"
ref = ["1.8", "D23"]

[[feature]]
group = "editor"
title = "Notes"
text = "Dated notes on lines, accounts and categories, and a notes list that works as a review checklist."
status = "have"
ref = ["2.8", "D35"]

