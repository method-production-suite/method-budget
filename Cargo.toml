[workspace]
resolver = "2"
members = [
    "crates/method-core",
    "crates/method-format",
    "crates/method-session",
    "crates/method-cli",
    "crates/method-app",
    "crates/method-web",
    "crates/method-release",
    "crates/xtask",
]

[workspace.package]
edition = "2021"
# The one place the version lives: every crate inherits it, the app and
# `method --version` report it, and `cargo xtask check-version` fails CI if
# anything disagrees. Change it with `cargo xtask bump` (docs/RELEASING.md).
version = "0.2.0"
license = "MIT OR Apache-2.0"

# The browser build (`cargo xtask web`, docs/research/web-session.md): small
# over fast, since the page downloads it. The desktop's profiles are untouched.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
