# Least privilege by default. Pin all actions to full commit SHAs (pinact run).
name: ci
# The dependency checks only (SUITE-STANDARDS.md section 6): on a pull request and on every
# push to main, the crate-age check and cargo deny, the two checks the ruleset requires.
# Everything else is run before a pull request is marked ready (scripts/check.sh, pasted under
# "Tested locally"), by the weekly build on every system (weekly.yml) and by every release
# (release.yml). A draft pull request runs nothing: marking it ready (`gh pr ready`) starts CI.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
# A newer push cancels an older run, on a pull request and on main alike.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cooldown:
    # Fails a pull request that adds crates published less than 14 days ago, and a push
    # to main whose lock holds any: a pull request checks what it adds or bumps, main
    # checks the whole lock every time (a crate already in the lock is never "changed",
    # so only a full check catches one that slipped in). crate-ages.yml runs the full
    # check weekly too.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # fuzz/ is its own workspace with its own lock (fuzz/README.md).
          for lock in Cargo.lock fuzz/Cargo.lock; do
            if [ "$EVENT" = pull_request ]; then
              python3 scripts/check-crate-ages.py --lock "$lock" --only-changed origin/main
            else
              python3 scripts/check-crate-ages.py --lock "$lock"
            fi
          done
  deny:
    # deny.toml: known advisories, licenses compatible with MIT OR Apache-2.0,
    # crates.io as the only source.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
