# Least privilege by default. Pin all actions to full commit SHAs (pinact run).
name: ci
# Pushes to main, and pull requests: a feature branch runs once (as its pull request), not
# twice. The org's Actions plan runs 20 jobs at a time across every repo (SUITE-STANDARDS.md,
# section 6).
# A draft pull request builds nothing (SUITE-STANDARDS.md section 6): CI starts when it is
# marked ready (`gh pr ready`) and runs on every push after that.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
# SUITE-STANDARDS.md section 6: no incremental builds (CI never reuses them) and only line
# tables for debug info, which keeps panics' file and line but cuts target/ several times.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
# A newer push to a pull request cancels its older run; main always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    # Decides what this push needs. Skipped on a draft pull request, and every other job
    # needs it, so a draft runs nothing. `rust` is false when every changed file is
    # documentation (below); the Rust jobs then skip with `if:` rather than
    # `paths-ignore`, so the required checks still report.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation only?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            from="$(git merge-base "$BASE" HEAD)"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            from="$BEFORE"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"   # nothing to compare with: build
            exit 0
          fi
          git diff --name-only "$from" HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          # Documentation: docs/ (but not the files the build reads: the release notes
          # and their template, and FORMAT.md, whose example a test checks), Markdown files
          # at the top (README.md is checked by the site job, which always runs), the
          # licences and the issue templates.
          rust=false
          while IFS= read -r f; do
            case "$f" in
              docs/releases/*|docs/release-notes-template.md|docs/FORMAT.md) rust=true ;;
              docs/*|LICENSE*|.github/ISSUE_TEMPLATE/*) ;;
              */*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          [ -s "$RUNNER_TEMP/changed" ] || rust=true
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config libgtk-3-dev
      - name: Rust components
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: The Field Station budget is reproducible
        # fixtures/field-station/: made again in a scratch folder from Method
        # Schedule's days file (field-station.budget.json) through the command
        # line and its MCP server, and every byte must match the committed files.
        run: |
          cargo build --locked -p method-cli
          METHOD=target/debug/method-budget python3 scripts/make-field-station.py --check
      - name: Third-party notices are up to date
        # THIRD-PARTY-NOTICES.md lists the crates the app and the command line ship,
        # from Cargo.lock; regenerate it with `cargo xtask notices` (docs/RELEASING.md).
        run: cargo xtask notices --check
      - name: The browser's crates build for WebAssembly
        # docs/research/web-session.md: method-session (and the engine and
        # format under it) must stay free of files, threads and clocks.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo xtask wasm-check
      # The wasm-bindgen command line, the version Cargo.lock has (cargo xtask web
      # refuses any other), built once and cached.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Restored everywhere, saved only from main (SUITE-STANDARDS.md section 6), so pull
      # requests never add cache entries of their own.
      - name: Restore the wasm-bindgen command line
        id: wasm-bindgen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wasm-bindgen.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen command line
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.wasm-bindgen.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Save the wasm-bindgen command line (main only)
        if: github.ref == 'refs/heads/main' && steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ steps.wasm-bindgen-cache.outputs.cache-primary-key }}
      - name: The page in a browser
        # cargo xtask web builds target/web (the page, the shim, the module and
        # the charts as files); the smoke test opens it in the runner's headless
        # Chrome: the topsheet draws, an edit updates the grand total, a chart
        # is fetched only when picked, and the page logs no errors.
        run: |
          cargo xtask web
          node scripts/web-smoke.mjs target/web
      - name: Version agrees everywhere and has release notes
        # docs/RELEASING.md: the workspace version, Cargo.lock, tauri.conf.json and
        # docs/releases/<version>.md must agree on every push.
        run: cargo xtask check-version
  cooldown:
    # Fails a pull request or a push that adds crates published less than 14 days ago
    # (pushes too: most work lands on main directly, not through pull requests).
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare with what the branch had before: main for a pull request, the
          # pushed-over commit for a push, main for a new branch. When there is nothing
          # to compare with (main itself force-pushed), every crate is checked.
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base=origin/main
          else
            base=""
          fi
          # fuzz/ is its own workspace with its own lock (fuzz/README.md).
          for lock in Cargo.lock fuzz/Cargo.lock; do
            if [ -n "$base" ]; then
              python3 scripts/check-crate-ages.py --lock "$lock" --only-changed "$base"
            else
              python3 scripts/check-crate-ages.py --lock "$lock"
            fi
          done
  deny:
    # deny.toml: known advisories, licenses compatible with MIT OR Apache-2.0,
    # crates.io as the only source.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  site:
    # README.md and site/index.html must match docs/features.toml and the newest release
    # notes (docs/WEBSITE.md); the Claude Code hooks behind that rule must still work.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Feature list and site are up to date
        run: python3 scripts/site.py --check
      - name: Brand files match scripts/make-brand.py
        run: python3 scripts/make-brand.py --check
      - name: Hook scripts
        run: bash scripts/hooks/test-hooks.sh
