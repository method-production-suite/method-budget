# Least privilege by default. Pin all actions to full commit SHAs (pinact run).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config libgtk-3-dev
      - name: Rust components
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: The browser's crates build for WebAssembly
        # docs/research/web-session.md: method-session (and the engine and
        # format under it) must stay free of files, threads and clocks.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo xtask wasm-check
      # The wasm-bindgen command line, the version Cargo.lock has (cargo xtask web
      # refuses any other), built once and cached.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the wasm-bindgen command line
        id: wasm-bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wasm-bindgen.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen command line
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.wasm-bindgen.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: The page in a browser
        # cargo xtask web builds target/web (the page, the shim, the module and
        # the charts as files); the smoke test opens it in the runner's headless
        # Chrome: the topsheet draws, an edit updates the grand total, a chart
        # is fetched only when picked, and the page logs no errors.
        run: |
          cargo xtask web
          node scripts/web-smoke.mjs target/web
      - name: Version agrees everywhere and has release notes
        # docs/RELEASING.md: the workspace version, Cargo.lock, tauri.conf.json and
        # docs/releases/<version>.md must agree on every push.
        run: cargo xtask check-version
  cooldown:
    # Fails a pull request or a push that adds crates published less than 14 days ago
    # (pushes too: most work lands on main directly, not through pull requests).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Compare with what the branch had before: main for a pull request, the
          # pushed-over commit for a push, main for a new branch. When there is nothing
          # to compare with (main itself force-pushed), every crate is checked.
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            base=origin/main
          else
            base=""
          fi
          # fuzz/ is its own workspace with its own lock (fuzz/README.md).
          for lock in Cargo.lock fuzz/Cargo.lock; do
            if [ -n "$base" ]; then
              python3 scripts/check-crate-ages.py --lock "$lock" --only-changed "$base"
            else
              python3 scripts/check-crate-ages.py --lock "$lock"
            fi
          done
  site:
    # README.md and site/index.html must match docs/features.toml and the newest release
    # notes (docs/WEBSITE.md); the Claude Code hooks behind that rule must still work.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Feature list and site are up to date
        run: python3 scripts/site.py --check
      - name: Brand files match scripts/make-brand.py
        run: python3 scripts/make-brand.py --check
      - name: Hook scripts
        run: bash scripts/hooks/test-hooks.sh
