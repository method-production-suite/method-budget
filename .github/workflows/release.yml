# Builds installable bundles when a version tag (v*) is pushed, and drafts a GitHub
# Release with them, the release notes and the update manifest. How releases are made,
# the secrets and what each one turns on: docs/RELEASING.md.
#
# - check: the tag names the workspace version, every place the version lives agrees,
#   and docs/releases/<version>.md is ready to publish (cargo xtask check-version --tag).
# - build: macOS universal, Intel and Apple silicon in one app (.app zip, .dmg and the
#   updater archive; SUITE-STANDARDS.md section 3, 2026-10-19), Windows and Linux.
#   The macOS job signs with the Developer ID, notarizes, staples and verifies when the
#   Apple secrets are set; it writes the updater archive and its signature when the
#   updater key is set and the app trusts a real key. Each of those steps skips cleanly
#   when its secrets are absent (the build is then ad-hoc signed, as before). Only the
#   steps that use a secret are given it.
# - release: the only job with write access. Builds latest.json from the signed updater
#   archive (cargo xtask update-manifest, which refuses malformed signatures, unknown
#   platforms, a key the app doesn't trust and a signature that doesn't name the
#   version) and drafts the release. Publishing the
#   draft is left to a person; until then nothing is served at releases/latest.
#
# Only first-party actions, pinned to full commit SHAs. No caches (release builds start
# clean). Permissions: contents: read everywhere except the release job's contents: write
# (it creates the draft release and uploads its files).
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        # A tag pushed on a side branch must not build or draft a release.
        # fetch-depth: 0 above fetched every branch, so origin/main is here
        # (no second fetch: credentials are not kept after checkout).
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: The tag, the version and the notes agree
        run: cargo xtask check-version --tag "$GITHUB_REF_NAME"
      - name: Every locked crate is at least 14 days old
        # SUITE-STANDARDS.md section 6: no release ships a crate younger than the
        # cooldown, so both locks are checked in full here, before any build or signing
        # step (build and release need this job). The script has no list of young crates
        # to excuse; the one exception it knows, a git dependency pinned to a full commit
        # from scripts/crate-age-git-allow.txt, has no publish date and cannot change.
        run: |
          set -euo pipefail
          for lock in Cargo.lock fuzz/Cargo.lock; do
            python3 scripts/check-crate-ages.py --lock "$lock"
          done

  build:
    name: build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs' code in one app: the Tauri CLI builds each target and joins them
          # with lipo (universal-apple-darwin).
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            rust_targets: ""
            target: ""
            bundles: msi,nsis
          - name: linux-x64
            # The oldest supported Ubuntu keeps the AppImage's glibc requirement low.
            os: ubuntu-22.04
            rust_targets: ""
            target: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Which optional secrets exist (true or false), never their values.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.CERT_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_ID != '' && secrets.AC_API_ISSUER_ID != '' && secrets.AC_API_KEY_P8_BASE64 != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # The certificate the macOS build is signed with (decisions.md, entry 48).
      # The Apple team the macOS build is signed for (decisions.md, entry 48). The identity
      # itself is read from the imported certificate, so no name sits in this file.
      SIGNING_TEAM_ID: XSRB3D643J
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config libgtk-3-dev file

      - name: Add Rust targets
        if: matrix.rust_targets != ''
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          # shellcheck disable=SC2086 # word splitting is intended
          rustup target add $RUST_TARGETS

      - name: Install Tauri CLI (pinned, prebuilt)
        # Its release download, checked against the SHA-256 pinned in the script, instead
        # of compiling it here (which took half the macOS build's time).
        shell: bash
        run: bash scripts/install-tauri-cli.sh

      - name: Decide what gets signed
        shell: bash
        run: |
          set -euo pipefail
          sign=no; notarize=no; updater=no
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_DEVELOPER_ID" = true ]; then
            sign=yes
            if [ "$HAS_NOTARY_KEY" = true ]; then notarize=yes; fi
          fi
          # Updater archives only for macOS for now (Windows and Linux are untested), only
          # with the private key, and only when the app trusts a real public key (with the
          # placeholder it would refuse every update anyway).
          key=none
          if [ "$RUNNER_OS" = macOS ]; then key="$(cargo xtask updater-key)"; fi
          if [ "$RUNNER_OS" = macOS ] && [ "$HAS_UPDATER_KEY" = true ] && [ "$key" != none ]; then
            updater=yes
          fi
          echo "Developer ID signing: $sign. Notarizing: $notarize. Updater archive: $updater (app trusts: $key)."
          if [ "$RUNNER_OS" = macOS ] && [ "$sign" = no ]; then
            echo "::notice::No Developer ID secrets: the macOS build is ad-hoc signed and not notarized (docs/RELEASING.md)."
          fi
          if [ "$RUNNER_OS" = macOS ] && [ "$updater" = no ]; then
            echo "::notice::No updater archive: the updater key secret is absent or the app still has the placeholder key (docs/RELEASING.md)."
          fi
          {
            echo "MACOS_SIGN=$sign"
            echo "MACOS_NOTARIZE=$notarize"
            echo "UPDATER=$updater"
          } >> "$GITHUB_ENV"

      - name: Compile the app (no signing secrets in reach)
        # Build before secrets (SUITE-STANDARDS.md, section 3): every dependency's build
        # script and proc macro runs here, before the keychain, the App Store Connect key or
        # the updater key exist on this machine. The bundle step below only packages, signs
        # and notarizes what this step compiled, and never compiles.
        shell: bash
        working-directory: crates/method-app
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(build --no-bundle)
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # The same configuration the bundle step uses, so the build it packages is this one.
          if [ "${UPDATER:-no}" = yes ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          cargo tauri "${args[@]}" -- --locked

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Search this keychain first, keeping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          # The identity is the Developer ID Application the .p12 holds, for our team; its
          # name stays out of the repository.
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]* ('"$SIGNING_TEAM_ID"')\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate holds no Developer ID Application identity for team $SIGNING_TEAM_ID."
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare the notarization key (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        shell: bash
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Bundle, sign and notarize (compiled above)
        shell: bash
        working-directory: crates/method-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          # Read by the Tauri CLI only when set; empty values are unset below.
          NOTARY_KEY_ID: ${{ runner.os == 'macOS' && secrets.AC_API_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ runner.os == 'macOS' && secrets.AC_API_ISSUER_ID || '' }}
          UPDATER_PRIVATE_KEY: ${{ runner.os == 'macOS' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          # Packaging only: `bundle` takes the build the step above compiled and never runs
          # cargo, so no third-party code runs while the secrets below are in reach.
          args=(bundle --bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          # Notarizing (the Tauri CLI notarizes and staples the app when these are set,
          # and only signs with a real identity when APPLE_SIGNING_IDENTITY is set).
          if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
            export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER"
          fi
          # Updater archive and its signature.
          if [ "${UPDATER:-no}" = yes ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_PRIVATE_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_PRIVATE_KEY_PASSWORD"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          unset NOTARY_KEY_ID NOTARY_ISSUER UPDATER_PRIVATE_KEY UPDATER_PRIVATE_KEY_PASSWORD
          cargo tauri "${args[@]}"

      - name: Sign, notarize and staple the disk image (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'yes'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NOTARY_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for dmg in "target/$TARGET/release/bundle/dmg/"*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify the signatures (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="target/$TARGET/release/bundle"
          for app in "$root"/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            # Universal: every executable in the app holds exactly Intel and Apple silicon
            # code, compared, not just printed.
            for exe in "$app/Contents/MacOS/"*; do
              archs="$(lipo -archs "$exe")"
              echo "$(basename "$exe"): $archs"
              if [ "$archs" != "x86_64 arm64" ]; then
                echo "::error::$exe is built for \"$archs\", expected \"x86_64 arm64\"."
                exit 1
              fi
            done
            if [ "${MACOS_SIGN:-no}" = yes ]; then
              codesign -dv --verbose=2 "$app" 2>&1 | grep -F "Authority=$APPLE_SIGNING_IDENTITY"
            fi
            if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=4 "$app"
            fi
          done
          if [ "${MACOS_NOTARIZE:-no}" = yes ]; then
            for dmg in "$root"/dmg/*.dmg; do
              codesign --verify --strict --verbose=2 "$dmg"
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            done
          fi

      - name: Forget the signing material (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Collect bundles
        # Installers get version-free names so the website can link
        # releases/latest/download/<file> (docs/RELEASING.md). The updater archive keeps
        # the versioned name latest.json expects.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "$TARGET" ]; then root="target/$TARGET/release/bundle"; else root="target/release/bundle"; fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist updater meta
          # one <what> <files...>: prints the single file, or stops the job when the
          # pattern matched none or several (the bundle changed shape: look before shipping).
          one() {
            local what="$1"
            shift
            if [ "$#" -ne 1 ]; then
              echo "::error::Expected exactly one $what, found $#: ${*:-none}" >&2
              exit 1
            fi
            printf '%s\n' "$1"
          }
          case "$RUNNER_OS" in
            macOS)
              app="$(one "macOS .app" "$root"/macos/*.app)"
              # A .app is a folder: zip it with ditto so permissions and the signature survive.
              ditto -c -k --keepParent "$app" dist/Method-Budget-macOS.app.zip
              dmg="$(one "macOS .dmg" "$root"/dmg/*.dmg)"
              cp "$dmg" dist/Method-Budget-macOS.dmg
              # The updater archive and its signature, named as latest.json expects
              # (no spaces: the name is the download URL).
              if [ "${UPDATER:-no}" = yes ]; then
                tgz="$(one "updater archive" "$root"/macos/*.app.tar.gz)"
                sig="$tgz.sig"
                if [ ! -f "$sig" ]; then
                  echo "::error::The updater archive has no signature ($sig)."
                  exit 1
                fi
                name="Method-Budget_${version}_universal.app.tar.gz"
                cp "$tgz" "updater/$name"
                cp "$sig" "updater/$name.sig"
              fi
              if [ "${MACOS_NOTARIZE:-no}" = yes ]; then echo yes > meta/macos-notarized; else echo no > meta/macos-notarized; fi
              ;;
            Windows)
              exe="$(one "NSIS installer" "$root"/nsis/*-setup.exe)"
              msi="$(one "MSI installer" "$root"/msi/*.msi)"
              cp "$exe" dist/Method-Budget-windows-x64-setup.exe
              cp "$msi" dist/Method-Budget-windows-x64.msi
              ;;
            Linux)
              deb="$(one "Debian package" "$root"/deb/*.deb)"
              appimage="$(one "AppImage" "$root"/appimage/*.AppImage)"
              cp "$deb" dist/Method-Budget-linux-amd64.deb
              cp "$appimage" dist/Method-Budget-linux-x86_64.AppImage
              ;;
          esac
          ls -l dist updater meta

      - name: Sign the updater archive for its version (macOS)
        # The app's updater (method-update, docs/decisions.md entry 83) requires the
        # signature to name the version latest.json announces; the Tauri CLI's doesn't, so
        # sign again with the same key (cargo xtask sign-update, docs/RELEASING.md). This runs
        # the release tooling "Decide what gets signed" compiled before any secret was in
        # reach, never cargo, so no build script runs while the key is here.
        if: runner.os == 'macOS' && env.UPDATER == 'yes'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -x target/debug/xtask
          target/debug/xtask sign-update --dir updater --version "${GITHUB_REF_NAME#v}"

      - name: Check the updater signature the way the app does (macOS)
        # The app's own verifier (method-update) on what was just signed, with the public key
        # in tauri.conf.json: a release never ships an update the app would refuse.
        if: runner.os == 'macOS' && env.UPDATER == 'yes'
        shell: bash
        run: target/debug/xtask verify-update --dir updater --version "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: updater-${{ matrix.name }}
          path: updater/*
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: meta-${{ matrix.name }}
          path: meta/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft release
    # The only job with write access: it drafts a GitHub Release for the tag with the
    # notes, the bundles and the update manifest. Publishing the draft is left to a person.
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Update manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(ls -A updater 2>/dev/null)" ]; then
            cargo xtask update-manifest --dir updater --version "$version" --out updater/latest.json
            cp updater/* dist/
          else
            echo "::notice::No updater archive in this release: no latest.json, so installed apps won't see it (docs/RELEASING.md)."
          fi

      - name: Checksums of every download
        # SHA256SUMS lists every file the release carries, by bare name (SUITE-STANDARDS.md,
        # section 3): Method Launcher checks a Windows or Linux download against it before
        # installing, and anyone can with `sha256sum -c --ignore-missing SHA256SUMS`.
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          # Bare names on purpose: they are what SHA256SUMS lists, and every one starts
          # with "Method-Budget" or is latest.json, never a dash.
          # shellcheck disable=SC2035
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          cp "docs/releases/$version.md" "$notes"
          # The installers the website links as releases/latest/download/<file>
          # (docs/RELEASING.md): every one must be here under exactly this name.
          for f in Method-Budget-macOS.dmg Method-Budget-macOS.app.zip \
            Method-Budget-windows-x64-setup.exe Method-Budget-windows-x64.msi \
            Method-Budget-linux-amd64.deb Method-Budget-linux-x86_64.AppImage; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f is missing; the website links releases/latest/download/$f."
              exit 1
            fi
          done
          if [ "$(cat meta/macos-notarized 2>/dev/null || echo no)" != yes ]; then
            printf '\n---\n\nThis macOS build is not notarized: the first launch needs the one-time Open Anyway step in docs/INSTALL.md.\n' >> "$notes"
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${prerelease[@]}" \
            --title "Method Budget $version" \
            --notes-file "$notes"
