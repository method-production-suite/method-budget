# Deploys site/ (methodbudget.com) to GitHub Pages.
#
# OFF until the repository is public. GitHub Pages on a private repository needs a paid
# plan, so the deploy job runs only when the repository variable PAGES_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables). Until then every run skips
# cleanly. Turning it on, the custom domain and the DNS records: docs/WEBSITE.md.
#
# Path-filtered, so engine work never triggers a deploy. The site is static and has no
# build step on purpose: site/ is the whole artifact. Pages must deploy from Actions
# (Settings > Pages > Source: GitHub Actions); with the Actions source the custom domain
# is set in Settings > Pages, and site/CNAME only documents it.
#
# Only first-party actions, pinned to full commit SHAs (bump with `pinact run`), the same
# rule as ci.yml and release.yml.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy: a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and only through the github-pages environment.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The feature list and "What's new" must match docs/features.toml and the newest
      # release notes before anything is published (ci.yml checks this on every push too).
      - name: Site is up to date
        run: python3 scripts/site.py --check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
