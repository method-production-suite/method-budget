# Deploys site/ (methodbudget.com) to GitHub Pages.
#
# OFF until the repository is public. GitHub Pages on a private repository needs a paid
# plan, so the deploy job runs only when the repository variable PAGES_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables). Until then every run skips
# cleanly. Turning it on, the custom domain and the DNS records: docs/WEBSITE.md.
#
# Path-filtered: the site, and the app the demo at /try/ is built from. The site itself is
# static with no build step: its generated parts (the feature list, What's new, the
# release notes page, the brand files) are committed, so the checks below only confirm
# that what is committed is what the generators produce. The one build step is the demo:
# `cargo xtask web --demo --out site/try` puts the app's page, the WebAssembly module and
# the charts of accounts into site/try/ (never committed; .gitignore), and a headless
# smoke test opens it before anything is published (docs/WEBSITE.md, "The demo"). Pages
# must deploy from Actions (Settings > Pages > Source: GitHub Actions); with the Actions
# source the custom domain is set in Settings > Pages, and site/CNAME only documents it.
#
# Only first-party actions, pinned to full commit SHAs (bump with `pinact run`), the same
# rule as ci.yml and release.yml.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # The demo at /try/ is the app's page on the engine.
      - "crates/**"
      - "templates/charts/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/web-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy: a half-published site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job can publish, and only through the github-pages environment.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The feature list and "What's new" must match docs/features.toml and the newest
      # release notes before anything is published (ci.yml checks this on every push too).
      - name: Site is up to date
        run: python3 scripts/site.py --check
      # The logo, favicons and touch icon must match the drawing in scripts/make-brand.py.
      - name: Brand files are up to date
        run: python3 scripts/make-brand.py --check
      # The demo (site/try/): the page in a browser, on the engine as WebAssembly.
      - name: WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # The wasm-bindgen command line, the version Cargo.lock has (cargo xtask web
      # refuses any other), built once and cached.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the wasm-bindgen command line
        id: wasm-bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wasm-bindgen.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the wasm-bindgen command line
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.wasm-bindgen.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Build the demo
        run: cargo xtask web --demo --out site/try
      - name: The demo opens in a headless browser
        run: node scripts/web-smoke.mjs site/try
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
