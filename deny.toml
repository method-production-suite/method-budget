# cargo deny check: known advisories, licenses and crate sources (the `deny`
# job in .github/workflows/ci.yml runs it on every push).

[advisories]
# Every advisory fails, unmaintained and unsound ones included, unless it is
# listed here with the reason it does not apply.
ignore = [
    # Unmaintained, no fix upstream; reached only through Tauri (gtk's macros on
    # Linux; urlpattern in tauri-utils). Drop each when Tauri moves off it.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro under Tauri's gtk crates" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: via urlpattern in tauri-utils" },
    # rustls 0.23.45, used only by the updater's HTTPS client: ureq 3.4.2 in
    # method-update, with rustls features std, tls12, logging and ring, and ureq's own
    # ClientConfig (ring provider, its built-in session cache, no ECH). Checked one by
    # one against that setup on 2026-10-19; none applies. The fix is 0.23.46
    # (published 2026-10-14): `cargo update -p rustls` and drop these four once it is
    # 14 days old (2026-10-28).
    { id = "RUSTSEC-2026-0346", reason = "Debug of client session values leaks secrets only through a custom ClientSessionStore; ureq uses rustls's built-in, redacted session cache and nothing here formats session values" },
    { id = "RUSTSEC-2026-0347", reason = "affects only clients with EchMode::Enable; ureq never configures Encrypted Client Hello" },
    { id = "RUSTSEC-2026-0348", reason = "affects only builds with the brotli feature; rustls is built without it (std, tls12, logging, ring)" },
    { id = "RUSTSEC-2026-0349", reason = "a downgrade from post-quantum to classical key exchange; the ring provider offers only X25519, P-256 and P-384, so no post-quantum group is ever offered to lose" },
]

[licenses]
# Everything we ship must be compatible with distributing Method Budget under
# MIT OR Apache-2.0. This is the list the dependency tree actually needs; a new
# license fails CI until someone has looked at it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots: the Mozilla root certificate list as data (the updater's
    # HTTPS client trusts it).
    "CDLA-Permissive-2.0",
    # File-level copyleft, unmodified (cssparser, selectors, dtoa-short via
    # Tauri; option-ext via dirs). Fine to ship alongside MIT/Apache code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common under Tauri; worth seeing, not worth failing.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The suite's shared crates (method-update), pinned to a full commit in
# crates/method-app/Cargo.toml; also on the crate-age check's allow list
# (scripts/crate-age-git-allow.txt).
allow-git = ["https://github.com/method-production-suite/method-libs"]
